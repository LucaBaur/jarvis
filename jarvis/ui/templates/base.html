<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151a">
  <title>{% block titel %}Jarvis{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="kopf">
    <a class="marke" href="/">Jarvis</a>
    {% block kopfzeile %}{% endblock %}
  </header>

  <main>
    {% block inhalt %}{% endblock %}
  </main>

  <footer class="fuss">
    {% if version %}<span>v{{ version }}</span>{% endif %}
    {% block fusszeile %}
    <form method="post" action="/logout"><button class="link">abmelden</button></form>
    {% endblock %}
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js").catch(function () {});
    }
  </script>
</body>
</html>
