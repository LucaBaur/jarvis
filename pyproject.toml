[project]
name = "jarvis"
version = "0.2.0"
description = "Selbst gehostetes LLM-Harness: Job-Queue mit verteilten Workern"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Windows bringt keine Zeitzonendatenbank mit; zoneinfo braucht sie.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
